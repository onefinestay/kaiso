language: python
python:
  - "2.7"
services:
  - neo4j

before_install:
  - sudo apt-get update # -qq
  - sudo apt-get install neo4j

install:
  - python setup.py -q install
  - pip install -r test_requirements.txt
  - /etc/init.d/neo4j-service info ; true
  - neo4j info ; true

script:
  - make test

